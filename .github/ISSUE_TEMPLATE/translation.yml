name: Translation
description: Report a wrong translation or offer a new language
labels: [translation]
body:
  - type: input
    id: lang
    attributes: { label: Language }
    validations: { required: true }
  - type: textarea
    id: details
    attributes:
      label: "What should be changed?"
      description: "Line id from i18n/<code>.tsv, current text, better text"
