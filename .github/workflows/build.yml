name: Build IPA

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pillow (icons)
        run: python3 -m pip install --break-system-packages pillow || python3 -m pip install pillow

      - name: Check translations
        run: python3 tools/i18n/build.py --stats

      - name: Build
        run: SDK="$(xcrun --sdk iphoneos --show-sdk-path)" bash build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: GXFiles-ipa
          path: GXFiles.ipa

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: GXFiles.ipa
          generate_release_notes: true

  # после релиза — обновить источник для Feather / SideStore / AltStore
  source:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: GXFiles-ipa
      - name: Update source/apps.json
        run: |
          python3 tools/update_source.py "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" GXFiles.ipa
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/apps.json
          git commit -m "source: $GITHUB_REF_NAME" || echo "no changes"
          git push origin main
