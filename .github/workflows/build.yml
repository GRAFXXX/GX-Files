name: Build IPA

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      release: ${{ steps.ver.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Pillow (icons)
        run: python3 -m pip install --break-system-packages pillow || python3 -m pip install pillow

      # релиз: тег v* или коммит в main со словом [release] (тег создаётся сам из версии в Info.plist)
      - name: Version
        id: ver
        run: |
          V=$(plutil -extract CFBundleShortVersionString raw Info.plist)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"; echo "release=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/heads/main && "$COMMIT_MSG" == *"[release]"* ]]; then echo "tag=v$V" >> "$GITHUB_OUTPUT"; echo "release=true" >> "$GITHUB_OUTPUT"
          else echo "tag=v$V" >> "$GITHUB_OUTPUT"; echo "release=false" >> "$GITHUB_OUTPUT"; fi
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}

      - name: Check translations
        run: python3 tools/i18n/build.py --stats

      - name: Test AI engine
        run: bash tests/run_ai_tests.sh

      - name: Test compiler (LC_UUID / dylib)
        run: SDK="$(xcrun --sdk iphoneos --show-sdk-path)" bash tests/run_compiler_tests.sh

      - name: Test certificate signing
        run: SDK="$(xcrun --sdk iphoneos --show-sdk-path)" bash tests/run_sign_tests.sh

      - name: Test .p12 parser (OpenSSL 3 / legacy formats)
        run: bash tests/run_p12_tests.sh

      - name: Build
        run: SDK="$(xcrun --sdk iphoneos --show-sdk-path)" bash build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: GXFiles-ipa
          path: GXFiles.ipa

      # та же версия выпускается заново — старый релиз и тег заменяются
      - name: Replace existing release
        if: steps.ver.outputs.release == 'true' && !startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          gh release delete "$TAG" --cleanup-tag -y --repo "$GITHUB_REPOSITORY" || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" >/dev/null 2>&1 || true

      - name: Release
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: GX Files ${{ steps.ver.outputs.tag }}
          files: GXFiles.ipa
          generate_release_notes: true

  # после релиза — обновить источник для Feather / SideStore / AltStore
  source:
    if: needs.build.outputs.release == 'true'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: GXFiles-ipa
      - name: Update source/apps.json
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          python3 tools/update_source.py "$GITHUB_REPOSITORY" "$TAG" GXFiles.ipa
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/apps.json
          git commit -m "source: $TAG" || echo "no changes"
          git push origin main
